[theme]
base = "light"
primaryColor = "#003B6F"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#13263B"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 1

[client]
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
